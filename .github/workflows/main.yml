name: Build Status

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 6 
      matrix:
        cfg:
          - { os: ubuntu-latest,   name: GNU,    cc: gcc,   cxx: g++,     platform: x64, root_install_dir: '/home/runner/work'}
          - { os: ubuntu-latest,   name: Clang,  cc: clang, cxx: clang++, platform: x64, root_install_dir: '/home/runner/work'}
          - { os: macos-15-intel,    name: Clang,  cc: clang, cxx: clang++, platform: x64, root_install_dir: '/Users/runner/work'} # intel runner
          - { os: macos-15,    name: Clang,  cc: clang, cxx: clang++, platform: arm64, root_install_dir: '/Users/runner/work'} # apple silicon runner
          - { os: windows-latest,  name: x32, cc: cl,    cxx: cl,      platform: x32, root_install_dir: 'D:\'}
          - { os: windows-latest,  name: x64, cc: cl,    cxx: cl,      platform: x64, root_install_dir: 'D:\'}
    env:
      BOOST_VERSION: 1.84.0
      EIGEN_VERSION: 3.4.0

    runs-on: ${{ matrix.cfg.os }}
    name:    ${{ matrix.cfg.os }} (${{ matrix.cfg.name }}, ${{ matrix.cfg.platform }})  
    steps:
      - name: Checkout project 
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        id: install-dependencies
        uses: vinecopulib/vinecopulib/.github/actions/install-dependencies@main
        with:
          os: ${{ matrix.cfg.os }}
          platform: ${{ matrix.cfg.platform }}
          boost_install_dir: ${{ matrix.cfg.root_install_dir }}
          eigen_install_dir: ${{ matrix.cfg.root_install_dir }}
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          wdm: 'false'

      - name: Set environment variables and path
        run:   |
          echo "CC=${{ matrix.cfg.cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.cfg.cxx }}" >> $GITHUB_ENV
          echo "BOOST_ROOT=${{ steps.install-dependencies.outputs.BOOST_ROOT }}" >>   $GITHUB_ENV
          echo "Boost_INCLUDE_DIR=${{ steps.install-dependencies.outputs.BOOST_ROOT }}/include" >> $GITHUB_ENV
          # The dependency action installs Eigen with `CMAKE_INSTALL_PREFIX` set to
          # `root_install_dir`, so its `Eigen3Config.cmake` lands under
          # `<root_install_dir>/share/eigen3/cmake`. CMake reads
          # `CMAKE_PREFIX_PATH` from the environment, and `find_package(Eigen3
          # NO_MODULE)` takes the headers from there.
          # Normalize separators: `root_install_dir` is `D:\` on Windows, whose
          # trailing backslash would escape the closing quote of this string, and
          # CMake wants forward slashes anyway. The dependency action normalizes
          # the same value the same way before using it as its install prefix.
          echo "CMAKE_PREFIX_PATH=$(echo '${{ matrix.cfg.root_install_dir }}' | tr '\\' '/')" >> $GITHUB_ENV
          if [ "${{ matrix.cfg.os }}" == "windows-latest" ]; then
            # No vcvarsall here: this is a bash step, so any environment it set
            # would die with the subshell, and the multi-config generator
            # selected below sets up the toolchain itself.
            echo "D:\a\vinecopulib\kde1d-cpp\release" >> $GITHUB_PATH
            echo "D:\a\vinecopulib\kde1d-cpp\release\Release" >> $GITHUB_PATH
          fi
        shell: bash
      - name: Compile the debug version
        run:   |
          mkdir debug && cd debug
          if [ "${{ matrix.cfg.os }}" != "windows-latest" ]; then
            if [ "${{ matrix.cfg.os }}/${{ matrix.cfg.name }}" == "ubuntu-latest/GNU" ]; then
              cmake .. -DSTRICT_COMPILER=ON \
              -DCODE_COVERAGE=ON -DOPT_ASAN=OFF \
              -DCMAKE_BUILD_TYPE=Debug
              make kde1d_coverage
            else
              cmake .. -DOPT_ASAN=OFF -DCMAKE_BUILD_TYPE=Debug
              make
            fi
          else
            cmake .. -A "${CMAKE_GEN_PLAT}" \
            -DCMAKE_BUILD_TYPE=Debug
            cmake --build .
          fi
        shell: bash
      - name: Code coverage
        uses: codecov/codecov-action@v5
        if: contains(matrix.cfg.os, 'ubuntu') && contains(matrix.cfg.name, 'GNU')
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: debug/coverage.info 
      - name: Compile and test the release version
        run:   |
          mkdir release && cd release
          if [ "${{ matrix.cfg.os }}" != "windows-latest" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release && make && sudo make install
            ctest --output-on-failure
          else
            cmake .. -A "${CMAKE_GEN_PLAT}" -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release
            ctest -C Release --output-on-failure
            cmake --build . --config Release --target install
          fi
        shell: bash

      # Building this repo's own tests uses the source tree, so it never
      # exercises the installed layout or the exported target's dependencies.
      # A downstream project does both.
      - name: Build a downstream consumer against the installed package
        if: matrix.cfg.os != 'windows-latest'
        run:   |
          cmake -S test/consumer -B consumer
          cmake --build consumer
          ./consumer/consumer
        shell: bash        

  # The unit tests pass on inputs whose memory behaviour is still wrong: a
  # zero-size `realloc` is undefined in C23, but it returns normally, and the
  # same is true of most undefined behaviour. CRAN runs the R package's tests
  # under valgrind and reports such calls as errors, so this suite has to be
  # run under a checker to catch them here first.
  #
  # Valgrind and the address sanitizer both instrument allocation and cannot
  # share a process, so they are separate matrix entries. They also do not see
  # the same things: valgrind catches the zero-size `realloc` above, which no
  # sanitizer flags, while the sanitizers catch signed overflow, bad shifts,
  # invalid casts and stack errors that valgrind cannot see. The leak
  # sanitizer comes with the address sanitizer on Linux, and GCC and Clang
  # disagree often enough about what UBSan instruments to be worth both.
  memory-checks:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { name: 'valgrind',            cc: gcc,   cxx: g++,     sanitizers: '' }
          - { name: 'asan+lsan+ubsan GNU', cc: gcc,   cxx: g++,     sanitizers: 'address,undefined' }
          - { name: 'asan+lsan+ubsan Clang', cc: clang, cxx: clang++, sanitizers: 'address,undefined' }
    runs-on: ubuntu-latest
    name: ubuntu-latest (${{ matrix.cfg.name }})
    env:
      BOOST_VERSION: 1.84.0
      EIGEN_VERSION: 3.4.0
      CMAKE_PREFIX_PATH: /home/runner/work
      CC: ${{ matrix.cfg.cc }}
      CXX: ${{ matrix.cfg.cxx }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        id: install-dependencies
        uses: vinecopulib/vinecopulib/.github/actions/install-dependencies@main
        with:
          os: ubuntu-latest
          platform: x64
          boost_install_dir: '/home/runner/work'
          eigen_install_dir: '/home/runner/work'
          boost_version: ${{ env.BOOST_VERSION }}
          eigen_version: ${{ env.EIGEN_VERSION }}
          wdm: 'false'
      - name: Install valgrind
        if: matrix.cfg.sanitizers == ''
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build
        # `OPT_ASAN` is on by default and would add `-fsanitize=address` to the
        # debug flags, which the valgrind entry must not carry.
        run: |
          cmake -S . -B check -DCMAKE_BUILD_TYPE=Release -DOPT_ASAN=OFF \
            -DSANITIZERS='${{ matrix.cfg.sanitizers }}'
          cmake --build check -j
        shell: bash
      - name: Run the tests under ${{ matrix.cfg.name }}
        # Both binaries run even if the first fails, so one report does not
        # hide the other; the loop keeps the worst exit status.
        run: |
          status=0
          for t in kde1d-unit-test kde1d-invariant-test; do
            echo "::group::$t"
            if [ -z '${{ matrix.cfg.sanitizers }}' ]; then
              valgrind --error-exitcode=1 --errors-for-leak-kinds=none \
                check/bin/$t || status=1
            else
              check/bin/$t || status=1
            fi
            echo "::endgroup::"
          done
          exit $status
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
